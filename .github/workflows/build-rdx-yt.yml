name: Build RDX-YT

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Patch, sign, and release RDX-YT
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Download official ReVanced artifacts
        shell: bash
        run: |
          set -euo pipefail

          CLI_URL="$({
            curl --fail --silent --show-error --location \
              https://api.github.com/repos/ReVanced/revanced-cli/releases/latest
          } | jq --raw-output \
            '[.assets[] | select(.name | endswith("-all.jar"))][0].browser_download_url')"

          PATCH_METADATA="$(curl --fail --silent --show-error --location \
            https://api.revanced.app/v5/patches)"
          PATCH_URL="$(jq --raw-output '.download_url' <<<"$PATCH_METADATA")"

          INTEGRATIONS_URL="$({
            curl --fail --silent --show-error --location \
              https://api.github.com/repos/ReVanced/revanced-integrations/releases/latest
          } | jq --raw-output \
            '[.assets[] | select(.name | endswith(".apk"))][0].browser_download_url')"

          test -n "$CLI_URL" && test "$CLI_URL" != "null"
          test -n "$PATCH_URL" && test "$PATCH_URL" != "null"
          test -n "$INTEGRATIONS_URL" && test "$INTEGRATIONS_URL" != "null"

          curl --fail --location --retry 3 --retry-all-errors \
            --output revanced-cli.jar "$CLI_URL"
          curl --fail --location --retry 3 --retry-all-errors \
            --output revanced-patches.rvp "$PATCH_URL"
          curl --fail --location --retry 3 --retry-all-errors \
            --output revanced-integrations.apk "$INTEGRATIONS_URL"

          test -s revanced-cli.jar
          test -s revanced-patches.rvp
          test -s revanced-integrations.apk

      - name: Resolve recommended YouTube version
        id: youtube
        shell: bash
        run: |
          set -euo pipefail

          java -jar revanced-cli.jar list-versions \
            --bypass-verification \
            --patches revanced-patches.rvp \
            --filter-package-names com.google.android.youtube \
            > supported-versions.txt 2>&1

          YOUTUBE_VERSION="$(awk '
            /com\.google\.android\.youtube/ { youtube = 1 }
            youtube && match($0, /[0-9]+\.[0-9]+\.[0-9]+/) {
              print substr($0, RSTART, RLENGTH)
              exit
            }
          ' supported-versions.txt)"

          # ReVanced Patches 6.x fallback if CLI output formatting changes.
          YOUTUBE_VERSION="${YOUTUBE_VERSION:-20.40.45}"
          echo "version=$YOUTUBE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using YouTube $YOUTUBE_VERSION"

      - name: Download stock YouTube APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stock-apk

          docker run --rm \
            --volume "$PWD/stock-apk:/output" \
            ghcr.io/efforg/apkeep:stable \
            --app "com.google.android.youtube@${{ steps.youtube.outputs.version }}" \
            --download-source apk-pure \
            --options acknowledge_dangers=true \
            /output

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          mapfile -t APKS < <(find stock-apk -maxdepth 1 -type f -iname '*.apk' | sort)
          mapfile -t BUNDLES < <(
            find stock-apk -maxdepth 1 -type f \
              \( -iname '*.xapk' -o -iname '*.apkm' -o -iname '*.apks' \) | sort
          )

          if [[ "${#APKS[@]}" -eq 1 && "${#BUNDLES[@]}" -eq 0 ]]; then
            SIGNATURE_SOURCE="${APKS[0]}"
          elif [[ "${#APKS[@]}" -eq 0 && "${#BUNDLES[@]}" -eq 1 ]]; then
            mkdir -p stock-apk/extracted
            unzip -q "${BUNDLES[0]}" -d stock-apk/extracted

            SIGNATURE_SOURCE=""
            while IFS= read -r candidate; do
              CANDIDATE_BADGING="$("$AAPT" dump badging "$candidate" | sed -n '1p')"
              if grep --quiet "name='com.google.android.youtube'" <<<"$CANDIDATE_BADGING" && \
                 grep --quiet "versionName='${{ steps.youtube.outputs.version }}'" <<<"$CANDIDATE_BADGING" && \
                 ! grep --quiet " split='" <<<"$CANDIDATE_BADGING"; then
                SIGNATURE_SOURCE="$candidate"
                break
              fi
            done < <(find stock-apk/extracted -type f -iname '*.apk' | sort)

            if [[ -z "$SIGNATURE_SOURCE" ]]; then
              echo "Could not identify the signed base APK inside ${BUNDLES[0]}" >&2
              exit 1
            fi
          else
            echo "Expected one APK or one split bundle; downloaded files were:" >&2
            find stock-apk -maxdepth 1 -type f -printf '%f\n' >&2
            exit 1
          fi

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$SIGNATURE_SOURCE" 2>&1)"
          SIGNER_SHA256="$(
            awk -F': ' '
              tolower($0) ~ /signer #[0-9]+ certificate sha-256 digest/ {
                print tolower($NF)
                exit
              }
            ' <<<"$CERT_OUTPUT" | tr -d ':[:space:]'
          )"

          # Fall back to hashing the first PEM certificate if apksigner changes
          # the human-readable digest label in a future build-tools release.
          if [[ -z "$SIGNER_SHA256" ]]; then
            "$APKSIGNER" verify --print-certs-pem "$SIGNATURE_SOURCE" \
              > signer-certificates.txt 2>&1
            awk '
              /-----BEGIN CERTIFICATE-----/ { certificate = 1 }
              certificate { print }
              /-----END CERTIFICATE-----/ { exit }
            ' signer-certificates.txt > signer-certificate.pem
            SIGNER_SHA256="$(
              openssl x509 -in signer-certificate.pem -noout -fingerprint -sha256 |
                sed 's/^.*=//' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]'
            )"
          fi
          case "$SIGNER_SHA256" in
            3d7a1223019aa39d9ea0e3436ab7c0896bfb4fb679f4de5fe7c23f326c8f994a | \
            5aad2bee6db95d17e05a08d7d1e64c10a1511879154483916b6ae6c7fd9cb0c6 | \
            7fd2cea30c3a6022eb29419ce8f6f92ce8a4bd35b0cc879ed3cca6cbf5e9992d)
              ;;
            *)
              echo "Untrusted stock APK signer: $SIGNER_SHA256" >&2
              exit 1
              ;;
          esac

          if [[ "${#APKS[@]}" -eq 1 ]]; then
            cp "$SIGNATURE_SOURCE" youtube.apk
          else
            APKEDITOR_URL="$(
              curl --fail --silent --show-error --location \
                https://api.github.com/repos/REAndroid/APKEditor/releases/latest |
                jq --raw-output \
                  '[.assets[] | select(.name | startswith("APKEditor-") and endswith(".jar"))][0].browser_download_url'
            )"
            test -n "$APKEDITOR_URL" && test "$APKEDITOR_URL" != "null"
            curl --fail --location --retry 3 --retry-all-errors \
              --output apkeditor.jar "$APKEDITOR_URL"
            java -jar apkeditor.jar m \
              -i "${BUNDLES[0]}" \
              -o youtube.apk \
              -clean-meta
          fi

          BADGING="$("$AAPT" dump badging youtube.apk | sed -n '1p')"
          grep --quiet "name='com.google.android.youtube'" <<<"$BADGING"
          grep --quiet "versionName='${{ steps.youtube.outputs.version }}'" <<<"$BADGING"

      - name: Patch and brand RDX-YT
        shell: bash
        run: |
          set -euo pipefail

          option_value() {
            local patch_name="$1"
            local option_key="$2"
            jq --exit-status --raw-output \
              --arg patch "$patch_name" \
              --arg key "$option_key" \
              '.[] | select(.patchName == $patch) | .options[] | select(.key == $key) | .value' \
              options.json
          }

          APP_NAME="$(option_value 'Custom branding' 'appName')"
          ICON_PATH="$(option_value 'Custom branding' 'iconPath')"
          PACKAGE_NAME="$(option_value 'Change package name' 'packageName')"

          test -d "$ICON_PATH"

          # CLI 5+ accepts patch options through -O. Integrations are now bundled
          # as extensions in the .rvp and must not be supplied with the removed -m flag.
          java -jar revanced-cli.jar patch \
            --bypass-verification \
            --patches revanced-patches.rvp \
            --enable "Custom branding" \
            --options "App name=$APP_NAME" \
            --options "Custom icon=$ICON_PATH" \
            --enable "Change package name" \
            --options "Package name=$PACKAGE_NAME" \
            --disable "Hide layout components" \
            --out RDX-YT-unsigned.apk \
            youtube.apk

      - name: Download Apktool
        run: wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

      - name: Decompile patched APK
        run: java -jar apktool.jar d RDX-YT-unsigned.apk -o decompiled_apk -f

      - name: Inject credits
        run: chmod +x apply_credits.sh && ./apply_credits.sh

      - name: Recompile credited APK
        run: java -jar apktool.jar b decompiled_apk -o RDX-YT-credited-unsigned.apk

      - name: Install zipalign
        run: sudo apt-get install zipalign

      - name: Zipalign credited APK
        run: zipalign -p 4 RDX-YT-credited-unsigned.apk RDX-YT-aligned.apk

      - name: Sign RDX-YT APK
        shell: bash
        run: |
          set -euo pipefail

          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"

          keytool -genkeypair \
            -keystore rdx-yt-temporary.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias rdx-yt \
            -keyalg RSA \
            -keysize 4096 \
            -validity 3650 \
            -dname "CN=RDX-YT, OU=Build Factory, O=Abdullah Naeem Rao, C=PK"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks rdx-yt-temporary.jks \
            --ks-key-alias rdx-yt \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out RDX-YT.apk \
            RDX-YT-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose RDX-YT.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: RDX-YT v1.0.0
          files: RDX-YT.apk
          fail_on_unmatched_files: true
          make_latest: true
