name: Build RDX-YT

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Patch, sign, and release RDX-YT
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Download official ReVanced artifacts
        shell: bash
        run: |
          set -euo pipefail

          CLI_URL="$({
            curl --fail --silent --show-error --location \
              https://api.github.com/repos/ReVanced/revanced-cli/releases/latest
          } | jq --raw-output \
            '[.assets[] | select(.name | endswith("-all.jar"))][0].browser_download_url')"

          PATCH_METADATA="$(curl --fail --silent --show-error --location \
            https://api.revanced.app/v5/patches)"
          PATCH_URL="$(jq --raw-output '.download_url' <<<"$PATCH_METADATA")"

          INTEGRATIONS_URL="$({
            curl --fail --silent --show-error --location \
              https://api.github.com/repos/ReVanced/revanced-integrations/releases/latest
          } | jq --raw-output \
            '[.assets[] | select(.name | endswith(".apk"))][0].browser_download_url')"

          test -n "$CLI_URL" && test "$CLI_URL" != "null"
          test -n "$PATCH_URL" && test "$PATCH_URL" != "null"
          test -n "$INTEGRATIONS_URL" && test "$INTEGRATIONS_URL" != "null"

          curl --fail --location --retry 3 --retry-all-errors \
            --output revanced-cli.jar "$CLI_URL"
          curl --fail --location --retry 3 --retry-all-errors \
            --output revanced-patches.rvp "$PATCH_URL"
          curl --fail --location --retry 3 --retry-all-errors \
            --output revanced-integrations.apk "$INTEGRATIONS_URL"

          test -s revanced-cli.jar
          test -s revanced-patches.rvp
          test -s revanced-integrations.apk

      - name: Resolve recommended YouTube version
        id: youtube
        shell: bash
        run: |
          set -euo pipefail

          java -jar revanced-cli.jar list-versions \
            --bypass-verification \
            --patches revanced-patches.rvp \
            --filter-package-names com.google.android.youtube \
            > supported-versions.txt 2>&1

          YOUTUBE_VERSION="$(awk '
            /com\.google\.android\.youtube/ { youtube = 1 }
            youtube && match($0, /[0-9]+\.[0-9]+\.[0-9]+/) {
              print substr($0, RSTART, RLENGTH)
              exit
            }
          ' supported-versions.txt)"

          # ReVanced Patches 6.x fallback if CLI output formatting changes.
          YOUTUBE_VERSION="${YOUTUBE_VERSION:-20.40.45}"
          echo "version=$YOUTUBE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using YouTube $YOUTUBE_VERSION"

      - name: Download stock YouTube APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stock-apk

          docker run --rm \
            --volume "$PWD/stock-apk:/output" \
            ghcr.io/efforg/apkeep:stable \
            --app "com.google.android.youtube@${{ steps.youtube.outputs.version }}" \
            --download-source apk-pure \
            /output

          mapfile -t APKS < <(find stock-apk -maxdepth 1 -type f -name '*.apk')
          if [[ "${#APKS[@]}" -ne 1 ]]; then
            echo "Expected exactly one APK from apkeep, found ${#APKS[@]}" >&2
            exit 1
          fi
          mv "${APKS[0]}" youtube.apk

          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging youtube.apk | head -n 1)"
          grep --quiet "name='com.google.android.youtube'" <<<"$BADGING"
          grep --quiet "versionName='${{ steps.youtube.outputs.version }}'" <<<"$BADGING"

      - name: Patch and brand RDX-YT
        shell: bash
        run: |
          set -euo pipefail

          option_value() {
            local patch_name="$1"
            local option_key="$2"
            jq --exit-status --raw-output \
              --arg patch "$patch_name" \
              --arg key "$option_key" \
              '.[] | select(.patchName == $patch) | .options[] | select(.key == $key) | .value' \
              options.json
          }

          APP_NAME="$(option_value 'Custom branding' 'appName')"
          ICON_PATH="$(option_value 'Custom branding' 'iconPath')"
          PACKAGE_NAME="$(option_value 'Change package name' 'packageName')"

          test -d "$ICON_PATH"

          # CLI 5+ accepts patch options through -O. Integrations are now bundled
          # as extensions in the .rvp and must not be supplied with the removed -m flag.
          java -jar revanced-cli.jar patch \
            --bypass-verification \
            --patches revanced-patches.rvp \
            --enable "Custom branding" \
            --options "App name=$APP_NAME" \
            --options "Custom icon=$ICON_PATH" \
            --enable "Change package name" \
            --options "Package name=$PACKAGE_NAME" \
            --disable "Hide layout components" \
            --out RDX-YT-unsigned.apk \
            youtube.apk

      - name: Sign RDX-YT APK
        shell: bash
        run: |
          set -euo pipefail

          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"

          keytool -genkeypair \
            -keystore rdx-yt-temporary.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias rdx-yt \
            -keyalg RSA \
            -keysize 4096 \
            -validity 3650 \
            -dname "CN=RDX-YT, OU=Build Factory, O=Abdullah Naeem Rao, C=PK"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          # Re-aligning invalidates the CLI's disposable signature, producing the
          # unsigned APK that is signed with this run's temporary local key.
          zip --delete RDX-YT-unsigned.apk \
            'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' \
            'META-INF/*.SF' 'META-INF/*.MF' || true
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            RDX-YT-unsigned.apk RDX-YT-aligned-unsigned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks rdx-yt-temporary.jks \
            --ks-key-alias rdx-yt \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out RDX-YT.apk \
            RDX-YT-aligned-unsigned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose RDX-YT.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: RDX-YT v1.0.0
          files: RDX-YT.apk
          fail_on_unmatched_files: true
          make_latest: true
